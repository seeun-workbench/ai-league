name: 11/13 시세 받기 (일회성)

on:
  push:
    branches: [main]
    paths:
      - "oneoff/fix-1113/get_price.py"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python oneoff/fix-1113/get_price.py
      - name: 결과 저장
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add oneoff/fix-1113/out
          git diff --cached --quiet || git commit -m "11/13 삼성전자 시세"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
