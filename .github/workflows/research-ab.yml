name: 조사 모델 비교 (일회성)

on:
  push:
    branches: [main]
    paths:
      - "oneoff/research-ab/ab.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 비교 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python oneoff/research-ab/ab.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add oneoff/research-ab/out || true
          git diff --cached --quiet || git commit -m "조사 모델 비교 결과 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
