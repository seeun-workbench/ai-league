name: 셀프 DM 서재 제목 채우기 (일회성)

on:
  push:
    branches: [main]
    paths:
      - "oneoff/dm-titles/titles.py"
      - "oneoff/dm-titles/urls.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dm-titles
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic requests
      - name: 제목 조회
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TITLES_DEADLINE_MIN: "95"
        run: python oneoff/dm-titles/titles.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add oneoff/dm-titles/out || true
          git diff --cached --quiet || git commit -m "셀프 DM 서재 제목 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
